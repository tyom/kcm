name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make test script executable
        run: chmod +x test_kcm.sh

      - name: Run tests
        run: |
          ./test_kcm.sh
          ./test_release.sh

  release:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write # create the release and upload the asset

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create release and attach the kcm script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if asset=$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "kcm") | .name'); then
            if [ -z "$asset" ]; then gh release upload "$tag" kcm; fi
          else
            gh release create "$tag" kcm --verify-tag --title "$tag" \
              --notes "Install via Homebrew: \`brew install tyom/tap/kcm\`" --generate-notes
          fi
          gh release download "$tag" --pattern kcm --output - | cmp - kcm
          # An interrupted create leaves a draft; publish it before Homebrew points at it.
          # Assigned first: a failure inside [ ... ] would not stop the job under set -e
          is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [ "$is_draft" = true ]; then
            gh release edit "$tag" --draft=false
          fi

  homebrew:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bump Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 kcm | awk '{print $1}')"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kcm"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/tyom/homebrew-tap.git" tap
          installed=$(sed -nE 's/^  version "([^"]+)".*/\1/p' tap/Formula/kcm.rb)
          if [ "$installed" != "$version" ]; then
            # The checkout may predate the tap's tag, so fetch it. Only a definite "not an ancestor" may update.
            git fetch --quiet origin "+refs/tags/v$installed:refs/tags/v$installed"
            status=0
            git merge-base --is-ancestor "$GITHUB_SHA" "refs/tags/v$installed" || status=$?
            case "$status" in
              0) echo "The tap already has a later release, $installed."; exit 0 ;;
              1) ;;
              *) echo "Cannot compare with the tap's release, $installed." >&2; exit 1 ;;
            esac
          fi
          cd tap
          f=Formula/kcm.rb
          sed -i '' -E "s|^  url \".*\"|  url \"${url}\"|"             "$f"
          sed -i '' -E "s|^  version \".*\"|  version \"${version}\"|" "$f"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${sha}\"|"       "$f"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "kcm ${version}"
          git push
